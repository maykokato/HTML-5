<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags em HTML</title>
</head>
<body>
    <h1>Tags em HTML 5</h1>
    <p>Em HTML 5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descrobrir qual tag devrá utilizar em cada caso.<p>
    <ul type="square">
        <li><abbr title="Use a tag <p>">Parágrafo</abbr></li>
        <li><abbr title="Use a tag <H1>">Título</abbr></li>
        <li><abbr title="Use a tag <IMG>">Imagens</abbr></li>
        <li><abbr title="Use a tag <ABBR>">Abreviações</abbr></li>
        <li><abbr title="Use a tag <CODE>">Códigos-fonte</abbr></li>
        <li><abbr title="Use a tag <OL>">Listas numeradas</abbr></li>
        <li><abbr title="Use a tag <UL>">Listas com demarcadores</abbr></li>
    </ul>
</body>
</html>
