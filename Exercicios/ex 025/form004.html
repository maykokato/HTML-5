<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="cadastro.php">
        <fieldset>
            <legend><h1>Novos formulários</h1></legend>
            <h1></h1>
            <p><label for="inome">Nome: </label>
                <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required>
            </p>
            <p><label for="iemail">Email: </label>
            <input type="email" name="email" id="iemail" autocomplete="email" required>
            </p>
            <p><label for="itelefone">Telefone:</label>
            <input type="tel" name="telefone" id="itelefone" autocomplete="tel" required placeholder="(xx) xxxxx-xxxx">
            </p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </fieldset>
    </form>
</body>
</html>
