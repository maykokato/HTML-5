<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Testando formulários</h1>
    <form action="">
        <p><label for="inome">Nome:</label> 
            <input type="text" name="nome" id="inome"></p>
        <p><label for="imedia">Média:</label> 
            <input type="number" name="media" id="imedia" min="0" max="10" placeholder="0 a 10" step="0.5"></p>
        <p><label for="imes">Período letivo:</label> 
            <input type="month" name="mes" id="imes"></p>
        <p><label for="idata">Dia da prova: </label>
            <input type="date" name="data" id="idata"></p> 
        <p><label for="ihora">Hora da prova</label>
            <input type="time" name="hora" id="ihora"></p>       
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
