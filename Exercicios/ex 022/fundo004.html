<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionando a aranha</title>

    <style>
    
    div.aranha{
        height: 97vh;
        background-image: url(imagens/aranha2.png);
        background-size: 100px;
        background-repeat: no-repeat;
        border: 5px solid red;
    }

    div#q2{
        background-position: top right;
    }

    div#q3{
        background-position: left bottom;
    }

    div#q4{
        background-position: right bottom;
    }

    div#q5{
        background-position: center center;
    }
</style>

</head>
<body>

    <div class="aranha" id="q1">
    </div>

    <div class="aranha" id="q2">
    </div>

    <div class="aranha" id="q3">
    </div>

    <div class="aranha" id="q4">
    </div>

    <div class="aranha" id="q5">
    </div>
    
</body>
</html>
