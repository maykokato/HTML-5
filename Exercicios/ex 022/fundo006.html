<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G1</title>

    <style>
       
        .cabecalho{
            height: 100px;
            background-color: blue;
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        body{
            margin: 0px;
        }

        div>a{
            display: inline-block;
            background-color: white;
            color: black;
            border-radius: 10px;
            padding: 10px 20px;
            margin: 10px;
         }

         .imagem{
            width: 200px;
            height: 200px;
            background-color: whitesmoke;

            border: 1px solid black;
            border-radius: 10px;
            margin-left: 1600px;
            margin-top: 100px;
            
            background-image: url("imagens/policia.avif ");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;   
         }

         .quadrado{
            width: 100px;
            height: 100px;
            background-color: red;
            border: solid 5px black;
            display: inline-block;
            margin-left: 20px;
            border-radius: 50px;
            background-image: url(imagens/aranha2.png);
            background-size: 100% 100%;
            background-position: bottom right;
         }        
         
    </style>

</head>
<body>

<div class="cabecalho">
    <a href="">Guia 1</a>
    <a href="">Guia 2</a>
    <a href="">Guia 3</a>
</div>  

<div class="imagem">

</div>

<div class="quadrado"></div>

</body>
</html>
