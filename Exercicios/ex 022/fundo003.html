<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionando uma imagem</title>

    <style>
    
    div.apontando{
        height: 250px;
        width: 250px;
        border: 3px solid red;
        border-radius: 30px;
        margin: 20px;
        background-image: url(imagens/aranha.png);
    }

    div#q1{
        background-position: left top;
    }

    div#q2{
        background-position: top center;
    }

    div#q3{
        background-position: right center;
    }

</style>

</head>
<body>
    <div class="apontando" id="q1">
    </div>

    <div class="apontando" id="q2">
    </div>

    <div class="apontando" id="q3">
    </div>
    
</body>
</html>
