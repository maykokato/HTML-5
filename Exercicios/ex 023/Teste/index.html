<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            width: 500px;
            height: 500px;
            background-color: yellow;
            display: flex;
        }

        div{
            width: 100px;
            height: 100px;
            background-color: green;
            border: 2px solid black;
            margin: 10px;
        }

        #contato{
            position: relative;
            top: 50%;
            left: 50%;
        }

        #informações{
            position: absolute;
            top: 0px;
            left: 0px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div id="contato"></div>
        <div id="informações"></div>
        
    </div>
</body>
</html>
