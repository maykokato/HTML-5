<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width='device-width', initial-scale=1.0">
    <style>
        td{
            border: 1px solid black;
            padding: 8px;
            text-align: center;
            vertical-align: middle;
        }

        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        }
        .amarelo{
            background-color: yellow;
        }
    </style>
    <title>Tabelas</title>
</head>
<body>
    <table>
        <tr>
            <td class="amarelo">A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td>B2</td>
            <td class="amarelo">C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td class="amarelo">B3</td>
            <td>C3</td>
        </tr>        
    </table>
</body>
</html>
