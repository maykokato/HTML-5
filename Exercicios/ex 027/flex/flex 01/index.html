<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box 002</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            background-color: gray;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        main{
            background-color: green;
            height: 10vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        section{
            background-color: blueviolet;
            width: 100px;
            height: 30px;
        }
    </style>
</head>
<body>
    <main>
        <section>
            tela de login
        </section>
    </main>
</body>
</html>
